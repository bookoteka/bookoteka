name: Release Tauri App

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
      name: Build and Release
      runs-on: ${{ matrix.platform }}
      
      permissions:
        contents: write

      strategy:
        fail-fast: false
        matrix:
          platform: [macos-latest, ubuntu-22.04, windows-latest]
      
      steps:
        - uses: actions/checkout@v4

        - name: Instalacja zależności systemowych (Linux)
          if: matrix.platform == 'ubuntu-22.04'
          run: |
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libsoup-3.0-dev \
              build-essential \
              curl \
              wget \
              file \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev

        - name: Instalacja Bun
          uses: oven-sh/setup-bun@v1
          with:
            bun-version: latest

        - name: Instalacja zależności
          run: bun install

        - name: Instalacja Rust toolchain
          uses: dtolnay/rust-toolchain@stable

        - name: Build i publikacja z Tauri Action
          uses: tauri-apps/tauri-action@v0.5.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tagName: app-v__VERSION__
            releaseName: 'Bookoteka v__VERSION__'
            releaseBody: 'Automatyczna wersja aplikacji Bookoteka.'
            releaseDraft: true
            prerelease: false
